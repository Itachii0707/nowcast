<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Neubrutalist Outer Tile with Drop Shadow -->
  <rect x="10" y="10" width="48" height="48" fill="#111111" />
  <rect x="6" y="6" width="48" height="48" fill="#f59e0b" stroke="#111111" stroke-width="4" />
  
  <!-- Concentric Radar Sweeps -->
  <circle cx="30" cy="30" r="18" stroke="#111111" stroke-width="2.5" stroke-dasharray="3 3" opacity="0.35" />
  <circle cx="30" cy="30" r="12" stroke="#111111" stroke-width="2" stroke-dasharray="2 2" opacity="0.45" />

  <!-- Sun Disk with Rays -->
  <circle cx="30" cy="30" r="9" fill="#111111" />
  <path d="M30 8V13M30 47V52M8 30H13M47 30H52M14.5 14.5L18 18M42 42L45.5 45.5M14.5 45.5L18 42M42 18L45.5 14.5" stroke="#111111" stroke-width="3" stroke-linecap="square"/>

  <!-- High-Voltage Lightning Bolt -->
  <polygon points="33,12 18,32 28,32 25,48 42,28 32,28" fill="#ffffff" stroke="#111111" stroke-width="2.5" stroke-linejoin="miter" />

  <!-- Live Status LED -->
  <circle cx="48" cy="12" r="5" fill="#84cc16" stroke="#111111" stroke-width="2" />
</svg>
